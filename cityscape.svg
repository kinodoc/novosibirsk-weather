<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMax slice">
<defs>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8bfcc"/><stop offset="1" stop-color="#40586b"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7396ab"/><stop offset="1" stop-color="#203a50"/></linearGradient>
