 <pattern id="warmWindows" width="24" height="25" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="5" height="8" rx="1" fill="#ffd38a" opacity=".55"/></pattern>
 <pattern id="coolWindows" width="27" height="28" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="7" height="10" rx="1" fill="#b9e5f5" opacity=".35"/></pattern>
