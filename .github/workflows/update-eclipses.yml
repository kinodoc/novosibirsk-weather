name: Update Novosibirsk eclipse data

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-eclipses:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Refresh eclipse data
        run: python scripts/update_eclipses.py
      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eclipse-data.json
          if git diff --cached --quiet; then
            echo "Eclipse data is already up to date."
          else
            git commit -m "Update Novosibirsk eclipse data"
            git push
          fi
